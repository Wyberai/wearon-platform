<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F72585;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C2185B;stop-opacity:1" />
    </linearGradient>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="96" ry="96" />
    </clipPath>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)" />

  <!-- Subtle inner glow overlay -->
  <rect width="512" height="512" rx="96" ry="96" fill="white" opacity="0.05" />

  <!-- White "W" letterform — bold, geometric, fashion-forward -->
  <path
    d="M 88 140
       L 148 140
       L 200 320
       L 256 180
       L 312 320
       L 364 140
       L 424 140
       L 340 372
       L 284 372
       L 256 292
       L 228 372
       L 172 372
       Z"
    fill="white"
    opacity="0.97"
  />

  <!-- Thin decorative underline bar -->
  <rect x="100" y="390" width="312" height="14" rx="7" fill="white" opacity="0.35" />
</svg>
