name: Build Wearon APK

on:
  workflow_dispatch:
    inputs:
      seller_id:
        description: 'Seller UUID'
        required: true
        type: string
      slug:
        description: 'Brand slug (e.g. zara-india)'
        required: true
        type: string
      brand_name:
        description: 'Display name of the brand'
        required: true
        type: string
      primary_color:
        description: 'Primary hex color (e.g. #1A73E8)'
        required: true
        type: string
      logo_url:
        description: 'Public URL of the brand logo'
        required: true
        type: string
      plan:
        description: 'Seller plan (growth | pro | enterprise)'
        required: true
        type: string

  repository_dispatch:
    types: [trigger-apk-build]

jobs:
  build:
    name: Build & Upload APK
    runs-on: ubuntu-latest

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      GITHUB_PAT: ${{ secrets.GH_PAT }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # Normalise inputs across both trigger types
      SELLER_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.seller_id || inputs.seller_id }}
      SLUG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.slug || inputs.slug }}
      BRAND_NAME: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.brand_name || inputs.brand_name }}
      PRIMARY_COLOR: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.primary_color || inputs.primary_color }}
      LOGO_URL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.logo_url || inputs.logo_url }}
      PLAN: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.plan || inputs.plan }}

    steps:
      # ── 1. Checkout the React Native app repo ─────────────────────────────
      - name: Checkout wearon-app
        uses: actions/checkout@v4
        with:
          repository: Wyberai/wearon-app
          token: ${{ secrets.GH_PAT }}
          ref: master

      # ── 2. Node.js 20 ─────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Java 17 for Gradle ─────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Install Expo CLI ───────────────────────────────────────────────
      - name: Install Expo CLI
        run: npm install -g @expo/cli@latest

      # ── 5. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 6. Generate placeholder assets (idempotent) ──────────────────────
      - name: Setup placeholder assets
        run: node scripts/setup-assets.js

      # ── 7. Write tenant config ────────────────────────────────────────────
      - name: Write tenant config
        run: |
          cat > tenant.config.json <<'EOF'
          {
            "slug": "${{ env.SLUG }}",
            "brandName": "${{ env.BRAND_NAME }}",
            "primaryColor": "${{ env.PRIMARY_COLOR }}",
            "logoUrl": "${{ env.LOGO_URL }}"
          }
          EOF
          echo "tenant.config.json written:"
          cat tenant.config.json

      # ── 8. Patch app.json with tenant values ──────────────────────────────
      - name: Inject tenant config into app.json
        run: node scripts/inject-tenant-config.js

      # ── 9. Decode and place the signing keystore ──────────────────────────
      - name: Decode keystore
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/wearon.keystore

      # ── 10. Expo prebuild (generates native Android project) ──────────────
      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      # ── 11. Sign release: inject keystore config into gradle.properties ───
      - name: Write gradle signing properties
        run: |
          cat >> android/gradle.properties <<EOF
          MYAPP_UPLOAD_STORE_FILE=wearon.keystore
          MYAPP_UPLOAD_KEY_ALIAS=${KEY_ALIAS}
          MYAPP_UPLOAD_STORE_PASSWORD=${KEYSTORE_PASSWORD}
          MYAPP_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD}
          EOF

      # ── 12. Build release APK ─────────────────────────────────────────────
      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # ── 13. Locate the APK ────────────────────────────────────────────────
      - name: Find APK path
        id: apk
        run: |
          APK_PATH=$(find android -name '*.apk' -path '*/release/*' | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK at: $APK_PATH"

      # ── 14. Upload APK to Supabase Storage ───────────────────────────────
      - name: Upload APK to Supabase Storage
        id: upload
        run: |
          OBJECT_PATH="${{ env.SELLER_ID }}/app-latest.apk"
          STORAGE_URL="${SUPABASE_URL}/storage/v1/object/apk-builds/${OBJECT_PATH}"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$STORAGE_URL" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@${{ steps.apk.outputs.path }}")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Upload succeeded (HTTP $HTTP_STATUS)"
          else
            echo "Upload failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          # Build the public URL
          APK_PUBLIC_URL="${SUPABASE_URL}/storage/v1/object/public/apk-builds/${OBJECT_PATH}"
          echo "apk_url=$APK_PUBLIC_URL" >> "$GITHUB_OUTPUT"
          echo "APK public URL: $APK_PUBLIC_URL"

      # ── 14. Update apk_builds row in Supabase ────────────────────────────
      - name: Update apk_builds — status complete
        run: |
          curl -s -X PATCH \
            "${SUPABASE_URL}/rest/v1/apk_builds?seller_id=eq.${{ env.SELLER_ID }}&status=eq.building" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"status\": \"complete\",
              \"apk_url\": \"${{ steps.upload.outputs.apk_url }}\",
              \"completed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }"

      # ── 15. Notify seller via platform API ───────────────────────────────
      - name: Notify seller
        run: |
          curl -s -X POST \
            "${SUPABASE_URL}/functions/v1/notify-apk-ready" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"seller_id\": \"${{ env.SELLER_ID }}\",
              \"apk_url\": \"${{ steps.upload.outputs.apk_url }}\",
              \"brand_name\": \"${{ env.BRAND_NAME }}\"
            }" || echo "Notify request sent (non-fatal if endpoint not yet deployed)"

      # ── On failure: mark build as failed ─────────────────────────────────
      - name: Mark build failed on error
        if: failure()
        run: |
          curl -s -X PATCH \
            "${SUPABASE_URL}/rest/v1/apk_builds?seller_id=eq.${{ env.SELLER_ID }}&status=in.(queued,building)" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"status\": \"failed\",
              \"completed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }"
